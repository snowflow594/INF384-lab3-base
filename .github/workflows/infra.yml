name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:

  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Formato
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar contra el backend remoto
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Validar
        working-directory: infra
        run: terraform validate

  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el codigo de infraestructura contra politicas
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'

  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Calcular el plan y exportarlo
        working-directory: infra
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > tfplan.json

      # Regla 2, primero: el plan queda visible en el PR aunque la regla 1
      # detenga el pipeline mas abajo.
      - name: Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Plan de Terraform\n\n```\n" + plan + "\n```",
            });

      # Regla 1: cualquier accion delete (incluye el borrado de un
      # reemplazo) detiene el pipeline. No hay excepcion codificable aca:
      # autorizar la destruccion es un acto humano fuera de este workflow.
      - name: Verificar que el plan no destruye recursos existentes
        working-directory: infra
        run: |
          set -euo pipefail
          destruccion="$(jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address' tfplan.json)"
          if [ -n "$destruccion" ]; then
            echo "::error::El plan destruye recursos existentes. Requiere autorizacion humana explicita, fuera de este pipeline."
            echo "$destruccion"
            exit 1
          fi
          echo "El plan no destruye ningun recurso existente."

      - name: Subir el plan guardado, para que 'aplicar' lo use sin recalcularlo
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          if-no-files-found: error

  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Init es obligatorio en este runner nuevo (plugins, backend), pero no
      # recalcula nada: el plan que se aplica es el binario descargado abajo.
      - name: Inicializar
        working-directory: infra
        run: terraform init -backend-config=backend.hcl

      - name: Descargar el plan guardado por el job 'plan'
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Aplicar el plan guardado, sin recalcularlo
        working-directory: infra
        run: terraform apply tfplan