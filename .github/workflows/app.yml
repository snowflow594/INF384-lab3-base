name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  calidad:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar el reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage

      - name: Analisis de calidad y cobertura en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales en el codigo y en el historial
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el arbol completo de dependencias con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # No hay input de la action para esto: --include-dev-deps solo
          # existe como flag de trivy. Viper (el motor de configuracion de
          # trivy) lee variables de entorno con prefijo TRIVY_ antes que el
          # config file, asi que esto equivale a pasar el flag directamente.
          # Sin esto, trivy excluye devDependencies y el informe trae un
          # solo hallazgo (tough-cookie en produccion) en vez del arbol
          # completo.
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: table
          output: trivy-dependencias.txt
          exit-code: '0'

      - name: Publicar el hallazgo en el resumen de la ejecucion
        if: always()
        run: |
          {
            echo '### Analisis de dependencias (Trivy) — informativo, no detiene'
            echo
            echo 'Arbol completo de `package-lock.json`, incluyendo devDependencies:'
            echo
            echo '```'
            cat trivy-dependencias.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el codigo fuente
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --json --quiet \
            --output=semgrep.json \
            src/

      - name: Anotar cada hallazgo sobre la linea que lo origina
        if: always()
        run: |
          jq -r '.results[] |
            "::warning file=\(.path),line=\(.start.line)::\(.check_id): \(.extra.message)"' \
            semgrep.json

  # TODO
  # Construir la imagen de la aplicacion y publicarla en el registro privado.
  #
  # Depende de los cuatro jobs anteriores y corre solo desde la rama principal.
  #
  # La imagen se publica con tres tags independientes sobre el mismo manifiesto:
  # el sha corto del commit, la version y el ambiente.
  #
  #   - El sha es el tag con el que se publica. Nace del commit, siempre
  #     existe y no se reasigna nunca.
  #   - La version identifica el artefacto para las personas y tampoco se
  #     reasigna.
  #   - El de ambiente se reasigna en cada publicacion y siempre apunta a lo
  #     ultimo publicado para ese ambiente.
  #
  # Los dos ultimos se apuntan al manifiesto ya publicado. Agregar un tag a
  # una imagen publicada no reenvia capas.
  #
  # La construccion es para linux/amd64 y declara el label
  # org.opencontainers.image.title con el nombre de la aplicacion.
  #
  # Condicion de detencion: cualquier fallo de construccion o de publicacion.
  #
  # El job desplegar consume la salida 'digest' de este job. El formato es
  # <registro>/<aplicacion>@sha256:... Exponer solo el sha del digest, o
  # nombrar la salida de otra manera, rompe el despliegue.
  #
  # outputs:
  #   digest: # TODO
  #
  # Sustituir el paso centinela por la implementacion.
  publicar:
    needs: [calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APLICACION: inf384-lab3
    outputs:
      digest: ${{ steps.imagen.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Entrar al registro
        id: registro
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar la imagen
        id: imagen
        env:
          REGISTRO: ${{ steps.registro.outputs.registry }}
        run: |
          set -euo pipefail

          sha="${GITHUB_SHA:0:7}"
          imagen="${REGISTRO}/${APLICACION}:${sha}"

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.title=${APLICACION}" \
            --tag "${imagen}" \
            .

          docker push "${imagen}"

          # El tag de ambiente apunta al manifiesto ya publicado bajo el
          # tag del sha: se copia por la API de ECR, sin reconstruir la
          # imagen ni reenviar capas.
          manifiesto="$(aws ecr batch-get-image \
            --repository-name "$APLICACION" \
            --image-ids imageTag="$sha" \
            --query 'images[0].imageManifest' \
            --output text)"

          aws ecr put-image \
            --repository-name "$APLICACION" \
            --image-tag prd \
            --image-manifest "$manifiesto" \
            > /dev/null

          digest="$(aws ecr describe-images \
            --repository-name "$APLICACION" \
            --image-ids imageTag="$sha" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          echo "digest=${REGISTRO}/${APLICACION}@${digest}" >> "$GITHUB_OUTPUT"

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
